name: Deploy to Production

on:
  push:
    branches: [deploy]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (errors only)
        run: npm run lint:error

      - name: Build frontend + server bundle
        run: npm run build:all
        env:
          NODE_ENV: production

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            git config --global --add safe.directory ${{ secrets.DEPLOY_PATH }}
            cd ${{ secrets.DEPLOY_PATH }}
            # The repo's lockfile is the source of truth; drop any server-side edits (e.g. from `npm install`) that would block the pull
            git checkout -- package-lock.json
            # Markdown docs are removed from the live server after each pull; restore them first so the pull doesn't conflict
            git ls-files -z --deleted -- '*.md' | xargs -0 -r git checkout --
            git pull origin deploy
            git ls-files -z -- '*.md' | xargs -0 -r rm -f
            npm ci
            npm run build:all
            pm2 flush
            pm2 restart impact-reports --update-env || pm2 start ecosystem.config.cjs --env production
            pm2 save
